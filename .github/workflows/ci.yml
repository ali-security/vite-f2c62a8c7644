name: CI

env:
  # 7 GiB by default on GitHub, setting to 6 GiB
  # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
  NODE_OPTIONS: --max-old-space-size=6144
  # install playwright binary manually (because pnpm only runs install script once)
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  # Vitest auto retry on flaky segfault
  VITEST_SEGFAULT_RETRY: 3
  # plain-text vitest summaries so the passed-test count is greppable in the logs
  NO_COLOR: "1"

# Remove default permissions of GITHUB_TOKEN for security
# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions: {}

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional vitest filter args appended to the test commands"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [18, 20, 22]
        include:
          # Active LTS + other OS
          - os: macos-latest
            node_version: 20
          - os: windows-latest
            node_version: 20
      fail-fast: false

    name: "Build&Test: node-${{ matrix.node_version }}, ${{ matrix.os }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Set node version to ${{ matrix.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: "pnpm"

      # pnpm.patchedDependencies gained launch-editor@2.8.1 (CVE-2024-52011);
      # let pnpm record the new patch hash instead of failing on the lockfile
      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      # Install playwright's binary under custom directory to cache
      - name: (non-windows) Set Playwright path and Get playwright version
        if: runner.os != 'Windows'
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/playwright-bin" >> $GITHUB_ENV
          PLAYWRIGHT_VERSION="$(pnpm ls --depth 0 --json -w playwright-chromium | jq --raw-output '.[0].devDependencies["playwright-chromium"].version')"
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV
      - name: (windows) Set Playwright path and Get playwright version
        if: runner.os == 'Windows'
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME\.cache\playwright-bin" >> $env:GITHUB_ENV
          $env:PLAYWRIGHT_VERSION="$(pnpm ls --depth 0 --json -w playwright-chromium | jq --raw-output '.[0].devDependencies["playwright-chromium"].version')"
          echo "PLAYWRIGHT_VERSION=$env:PLAYWRIGHT_VERSION" >> $env:GITHUB_ENV

      - name: Cache Playwright's binary
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-playwright-bin-v1-${{ env.PLAYWRIGHT_VERSION }}
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          restore-keys: |
            ${{ runner.os }}-playwright-bin-v1-

      - name: Install Playwright
        # does not need to explicitly set chromium after https://github.com/microsoft/playwright/issues/14862 is solved
        run: pnpm playwright install chromium

      - name: Build
        run: pnpm run build

      # verbose reporter: print every test (passed, and skipped with a down-arrow) by name
      - name: Test unit
        run: pnpm run test-unit --reporter=verbose ${{ inputs.test-filter }}

      - name: Test serve
        run: pnpm run test-serve --reporter=verbose ${{ inputs.test-filter }}

      - name: Test build
        run: pnpm run test-build --reporter=verbose ${{ inputs.test-filter }}

      # Name the reason for every skipped/todo test: they are all upstream's own
      # conditional guards in the spec files, listed here with file:line.
      - name: Explain skipped tests
        shell: bash
        run: |
          echo "Skip reasons (upstream guards in the spec sources):"
          echo "  runIf(isBuild)    -> skipped in test-serve (build-mode-only test)"
          echo "  runIf(isServe) / runIf(!isBuild) -> skipped in test-build (dev-server-only test)"
          echo "  skipIf(isWindows) / runIf(!isWindows) -> skipped on Windows; runIf(isWindows) -> skipped elsewhere"
          echo "  runIf(isServe && !noNetworkImports) -> skipped on Node >= 22 (--experimental-network-imports removed)"
          echo "  runIf(isImportAttributesSupported) -> skipped on Node without import attributes"
          echo "  runIf(process.getuid() !== 0) -> skipped when running as root"
          echo "  test.skip / test.todo -> disabled/unimplemented upstream"
          grep -rnE '\.(skipIf|runIf)\(|\b(test|it|describe)\.(skip|todo)\b' \
            --include='*.spec.ts' playground packages/vite/src

      - name: Pack vite
        if: matrix.os == 'ubuntu-latest' && matrix.node_version == 20
        working-directory: packages/vite
        env:
          UV_THREADPOOL_SIZE: 1
        run: pnpm pack

      - name: Upload vite tarball
        if: matrix.os == 'ubuntu-latest' && matrix.node_version == 20
        uses: actions/upload-artifact@v4
        with:
          name: vite-tarball
          path: packages/vite/vite-*.tgz
          if-no-files-found: error

  lint:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    name: "Lint: node-20, ubuntu-latest"
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Set node version to 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # see the "Install deps" step of the test job
      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm prettier --check .

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test docs
        run: pnpm run test-docs

      # From https://github.com/rhysd/actionlint/blob/main/docs/usage.md#use-actionlint-on-github-actions
      - name: Check workflow files
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color -shellcheck=""
